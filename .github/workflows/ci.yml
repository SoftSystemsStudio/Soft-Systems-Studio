name: Core CI (Canonical)

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '8.11.0'

jobs:
  ci:
    name: Build, Typecheck, Lint, Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Phase 1 Recovery: NO external services
    # Redis/Postgres/Qdrant are not provisioned for default CI.
    # Heavy integration tests are gated behind CI_STABLE=true.
    # This ensures fast, deterministic feedback without external dependencies.

    env:
      NODE_ENV: test
      # Dummy values to satisfy env validation in agent-api tests.
      # No real connections are made — tests use mocks.
      POSTGRES_URL: postgresql://ci:ci@localhost:5432/ci
      OPENAI_API_KEY: test-ci-dummy-openai-key-not-real
      JWT_SECRET: ci-test-jwt-secret-placeholder-must-be-32-chars-long
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm -w -r build

      - name: Lint
        run: pnpm lint

      - name: Typecheck @softsystems/core-llm
        run: pnpm --filter @softsystems/core-llm run typecheck

      - name: Typecheck @softsystems/agent-customer-service
        run: pnpm --filter @softsystems/agent-customer-service run typecheck

      - name: Typecheck apps-agent-api
        run: pnpm --filter apps-agent-api run typecheck

      - name: Test (frontend)
        run: pnpm --filter frontend test

      - name: Test (agent-api)
        run: pnpm --filter apps-agent-api test
        continue-on-error: true

      - name: Inspect built scripts
        run: ls -la apps/agent-api/dist/scripts || true

      - name: Boot test (smoke test for missing deps)
        run: pnpm --filter apps-agent-api boot-test:dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            apps/*/dist
            packages/*/dist
          retention-days: 7

  deploy-staging:
    name: Deploy (Staging)
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist

      - name: Deploy to staging
        run: |
          echo "🚀 Deploying to staging environment..."
          # Add your staging deployment commands here
          # Example: railway deploy --environment staging
          # Example: fly deploy --config fly.staging.toml

      - name: Health check
        run: |
          echo "🏥 Running health check..."
          # Add health check after deployment
          # Example: curl -f https://staging.yourdomain.com/health || exit 1

      - name: Notify deployment
        if: always()
        run: |
          echo "📢 Staging deployment ${{ job.status }}"
          # Add Slack/Discord webhook notification here

  deploy-production:
    name: Deploy (Production)
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist

      - name: Pre-deploy checks
        run: |
          echo "🔍 Running pre-deploy safety checks..."
          # Verify no placeholder secrets
          node scripts/scan-placeholders.js || exit 1
          # Check for .env files that shouldn't be committed
          node scripts/check-env-committed.js || exit 1

      - name: Deploy to production
        run: |
          echo "🚀 Deploying to production environment..."
          # Add your production deployment commands here
          # Example: railway deploy --environment production
          # Example: fly deploy --config fly.production.toml

      - name: Run database migrations
        run: |
          echo "📦 Running production database migrations..."
          # Example: pnpm --filter apps-agent-api prisma migrate deploy

      - name: Health check
        run: |
          echo "🏥 Running production health check..."
          # Add health check after deployment
          # Example: curl -f https://api.yourdomain.com/health || exit 1

      - name: Smoke tests
        run: |
          echo "🔥 Running smoke tests..."
          # Add critical path smoke tests
          # Example: curl -f https://api.yourdomain.com/status || exit 1

      - name: Notify deployment
        if: always()
        run: |
          echo "📢 Production deployment ${{ job.status }}"
          # Add Slack/Discord webhook notification here
