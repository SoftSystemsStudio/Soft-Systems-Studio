name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.11.0
      - name: Install
        run: pnpm -w install
      - name: Lint
        run: pnpm -r --if-present run lint
      - name: Test (agent-api)
        run: pnpm --filter apps-agent-api test -- --runInBand
      - name: Build (agent-api)
        run: pnpm --filter apps-agent-api run build
