name: Full Integration Tests (Lane B)

on:
  workflow_dispatch: # Manual trigger
  schedule:
    - cron: '0 2 * * 1,4' # Twice weekly at 02:00 UTC (Monday and Thursday)

permissions:
  contents: read
  pull-requests: write

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '8.11.0'

jobs:
  full-integration:
    name: Full Integration (Services + Heavy Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Phase 3: Full validation with all external services
    # This lane is NOT a merge blocker; it runs nightly or on manual dispatch
    # to provide deep validation without impeding feature velocity.

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent_api_test
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/agent_api_test
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      CI_STABLE: 'true'
      JWT_SECRET: test-secret-min-32-characters-long
      JWT_REFRESH_SECRET: test-refresh-secret-min-32-chars
      OPENAI_API_KEY: test-key-for-mocking
      PRISMA_ACCEPT_DATA_LOSS: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for Postgres
        run: |
          for i in {1..60}; do
            pg_isready -h localhost -p 5432 -U postgres && echo "Postgres ready" && break || sleep 1
          done

      - name: Wait for Redis
        run: |
          for i in {1..60}; do
            redis-cli -h localhost -p 6379 ping && echo "Redis ready" && break || sleep 1
          done

      - name: Generate Prisma clients
        run: pnpm --filter apps-agent-api prisma generate

      - name: Run DB migrations
        run: pnpm --filter apps-agent-api prisma migrate deploy

      - name: Build workspace
        run: pnpm -w -r build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm -w exec tsc --noEmit

      - name: Run Full Test Suite (with CI_STABLE=true)
        run: pnpm test --runInBand
        env:
          CI_STABLE: 'true'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-full-integration
          path: coverage/
          retention-days: 30

  notify-on-failure:
    name: Notify on Failure (Optional)
    runs-on: ubuntu-latest
    needs: full-integration
    if: failure()

    steps:
      - name: Log failure
        run: |
          echo "🔴 Full Integration Tests Failed"
          echo "This does NOT block merges (Lane B is optional)."
          echo "Investigate at: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
